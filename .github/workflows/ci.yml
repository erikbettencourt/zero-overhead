# Every pull request (and every change to main) must type-check, build and pass the tests.
# The "Test and build" check can be required in the branch ruleset.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Builds first: the tests serve nothing from dist, but a broken build should fail fast.
      - run: npm run build

      - run: npm test
